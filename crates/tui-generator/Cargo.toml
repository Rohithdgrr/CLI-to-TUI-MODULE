[package]
name = "tui-generator"
description = "Automatically generate interactive TUI from CLI structs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ratatui"]
clap = ["dep:tui-generator-clap", "dep:tui-generator-macros", "dep:clap"]
ratatui = ["dep:tui-generator-ratatui"]
serde = ["tui-generator-core/serde"]

[dependencies]
tui-generator-core.workspace = true
tui-generator-macros = { workspace = true, optional = true }
tui-generator-clap = { workspace = true, optional = true }
tui-generator-ratatui = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[example]]
name = "image-processor"
required-features = ["clap"]

[[example]]
name = "minimal"
required-features = ["clap"]
